<html lang="it">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>

:root[data-theme="dark"]{--grass:#2d5b46;--hill:#264d3b;--river:#1f55a0;--river2:#4a82d0;--bg:#14204a;--ink:#eaf0ff;--mute:#a4b5de;--blue:#8aa9ff;--soft:#22336b;--line:#2c3f80}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:500 16px/1.4 Fredoka,system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
.top{padding:10px 14px 8px;background:var(--bg)}
.row,.row2,.prog{display:flex;align-items:center;gap:10px}
.row{justify-content:space-between}
h1{margin:0;font:700 1.7rem Fredoka,sans-serif;letter-spacing:.5px}
#tabs{display:flex;gap:6px}
.tab{border:2px solid var(--line);background:var(--soft);color:var(--ink);border-radius:14px;padding:4px 10px;font:700 .85rem Fredoka,sans-serif;cursor:pointer;line-height:1.1}
.tab small{display:block;font-weight:500;font-size:.66rem;color:var(--mute)}
.tab[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.tab[aria-selected=true] small{color:#e3ebff}
.row2{justify-content:space-between;margin-top:6px}
h2{margin:0;font:700 1rem Fredoka,sans-serif;min-width:0}
.btn{flex:none;background:var(--sun);color:#14213d;font-weight:700;border-radius:99px;padding:5px 12px;text-decoration:none;font-size:.8rem}
.prog{margin-top:6px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
#pt{font-size:.78rem;color:var(--mute)}
.mapbox{position:relative;flex:1;min-height:0;border-radius:26px 26px 0 0;overflow:hidden;box-shadow:inset 0 0 0 4px var(--bg)}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--grass)}
#map:active{cursor:grabbing}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button,.ctl button{width:42px;height:42px;border-radius:50%;border:3px solid var(--blue);background:#fff;color:var(--blue);font:700 1.3rem Fredoka,sans-serif;cursor:pointer;line-height:1}
.zoom button:focus-visible,.ctl button:focus-visible,.tab:focus-visible,.btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.sheet{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 16px 10px;background:var(--bg);border-top:3px dashed var(--line)}
.sheet h3{margin:0;font:700 1.15rem Fredoka,sans-serif}
.sheet p{margin:0;color:var(--mute);font-size:.92rem}
.meta{font-size:.78rem;font-weight:700;color:var(--blue)}
.tag{display:inline-block;background:var(--sun);color:#14213d;font-weight:700;font-size:.72rem;border-radius:8px;padding:0 8px;margin-top:3px}
.ph{margin-top:4px;display:none}.ctl{grid-column:2;grid-row:1/4;display:flex;align-items:center;gap:8px}
.ctl button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ctl button:disabled{opacity:.35}
.hint{grid-column:1/3;text-align:center;font-size:.76rem;margin-top:2px!important}
.lbl{font:700 14px Fredoka,sans-serif;fill:#1b2a4e;stroke:#fff;stroke-width:4px;paint-order:stroke;stroke-linejoin:round;pointer-events:none}
.pin{cursor:pointer}
.pi{transform-origin:0 0;transition:transform .25s}
.pin.sel .pi{transform:scale(1.25)}
.ring{fill:none;stroke:var(--sun);stroke-width:5;opacity:0;transform-origin:0 0}
.pin.sel .ring{opacity:1;animation:pulse 1.3s ease-out infinite}
.dr{animation:drift 90s linear infinite}
.boat{animation:sail 60s linear infinite}
#walker{pointer-events:none}
@keyframes pulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.7);opacity:0}}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}
@keyframes sail{from{transform:translateX(1150px)}to{transform:translateX(-200px)}}

</style>
</head>

    <div><h3 id="sh"></h3><p id="sp"></p><span class="tag" id="sg"></span> <a class="btn ph" id="ph" target="_blank" rel="noopener">📷 Foto</a></div>
    <p class="hint">Tocca una tappa per segnarla come fatta.</p>
  </section>
</div>

  var t=$("tabs");t.innerHTML="";
  DAYS.forEach(function(d,i){var b=document.createElement("button");b.className="tab";b.setAttribute("role","tab");b.setAttribute("aria-selected",i===cur);
    b.appendChild(document.createTextNode(d.n));var s=document.createElement("small");s.textContent=d.s;b.appendChild(s);
    b.onclick=function(){if(cur!==i){cur=i;build()}};t.appendChild(b)})}
function upd(){
  var d=DAYS[cur],it=d.items[sel],n=0;
  d.items.forEach(function(_,i){var on=store[cur+"-"+i];if(on)n++;
    var g=svg.querySelector('.pin[data-i="'+i+'"]');g.classList.toggle("sel",i===sel);
    g.querySelector(".pc").setAttribute("fill",on?"var(--ok)":"#fff");g.querySelector(".pc").setAttribute("stroke",on?"var(--ok)":"var(--blue)");
    var e=g.querySelector(".em");e.textContent=on?"✓":d.items[i][1];e.setAttribute("fill",on?"#fff":"#000")});
  $("st").textContent=it[0];$("sc").textContent=(sel+1)+" / "+d.items.length;
  $("sh").textContent=it[2];var q=PH[it[2]];$("ph").style.display=q?"inline-block":"none";if(q)$("ph").href="https://www.google.com/search?tbm=isch&q="+encodeURIComponent(q);$("sp").textContent=it[3]||"";$("sg").textContent=it[4]||"";$("sg").style.display=it[4]?"inline-block":"none";
  $("dn").classList.toggle("on",!!store[cur+"-"+sel]);$("pv").disabled=sel===0;$("nx").disabled=sel===d.items.length-1;
  $("fill").style.width=(n/d.items.length*100)+"%";$("pt").textContent=n+" tappe su "+d.items.length+" fatte";
}
function go(i){
  var d=DAYS[cur],a=d.idx[sel],b=d.idx[i];if(i===sel)return;
  var pts=d.pts.slice(Math.min(a,b),Math.max(a,b)+1);if(a>b)pts.reverse();
  var seg=[],len=0;for(var k=0;k<pts.length-1;k++){var l=Math.hypot(pts[k+1][0]-pts[k][0],pts[k+1][1]-pts[k][1]);seg.push(l);len+=l}
  anim={pts:pts,seg:seg,len:len,s:performance.now(),d:RM?0:clamp(len/26*1000,3500,14000)};follow=true;
  tg.w=clamp(Math.min(cam.w,560),380,560);sel=i;upd();kick();
}
function toggle(i){var k=cur+"-"+i;store[k]=!store[k];save();upd()}
$("pv").onclick=function(){if(sel>0)go(sel-1)};
$("nx").onclick=function(){if(sel<DAYS[cur].items.length-1)go(sel+1)};
$("dn").onclick=function(){toggle(sel)};
function zoom(f){tg.w=clamp(tg.w*f,260,1500);follow=false;kick()}
$("zi").onclick=function(){zoom(.7)};$("zo").onclick=function(){zoom(1.4)};$("zf").onclick=function(){fit()};

/* ---------- trascinare e pizzicare ---------- */
var ptr={},moved=false,pinch=0,start=null;
svg.addEventListener("pointerdown",function(e){ptr[e.pointerId]={x:e.clientX,y:e.clientY};start={x:e.clientX,y:e.clientY,cx:cam.cx,cy:cam.cy};moved=false;
  var ids=Object.keys(ptr);if(ids.length===2){var a=ptr[ids[0]],b=ptr[ids[1]];pinch=Math.hypot(a.x-b.x,a.y-b.y)}});
svg.addEventListener("pointermove",function(e){
  if(!ptr[e.pointerId])return;ptr[e.pointerId]={x:e.clientX,y:e.clientY};var ids=Object.keys(ptr),r=svg.getBoundingClientRect();
  if(ids.length===2){var a=ptr[ids[0]],b=ptr[ids[1]],dd=Math.hypot(a.x-b.x,a.y-b.y);if(pinch){cam.w=tg.w=clamp(cam.w*pinch/dd,260,1500);apply()}pinch=dd;moved=true;return}
  var dx=e.clientX-start.x,dy=e.clientY-start.y;
  if(!moved&&Math.hypot(dx,dy)<6)return;
  if(!moved){try{svg.setPointerCapture(e.pointerId)}catch(x){}}
  moved=true;follow=false;var k=cam.w/r.width;
  cam.cx=tg.x=clamp(start.cx-dx*k,-100,1100);cam.cy=tg.y=clamp(start.cy-dy*k,-60,700);apply()});
function up(e){delete ptr[e.pointerId];pinch=0;if(Object.keys(ptr).length===1){var id=Object.keys(ptr)[0];start={x:ptr[id].x,y:ptr[id].y,cx:cam.cx,cy:cam.cy}}}
svg.addEventListener("pointerup",up);svg.addEventListener("pointercancel",up);
svg.addEventListener("wheel",function(e){e.preventDefault();cam.w=tg.w=clamp(cam.w*Math.exp(e.deltaY*.0012),260,1500);apply()},{passive:false});
svg.addEventListener("click",function(e){if(moved)return;var g=e.target.closest(".pin");if(!g)return;var i=+g.getAttribute("data-i");if(i===sel)toggle(i);else go(i)});
window.addEventListener("resize",function(){apply()});
deco();build();
</script>
